<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Avionics GPS/Radio PCB — Christopher Sparrow</title>
  <meta name="description" content="Portfolio case study: custom 4-layer KiCad PCB for AerospaceNU's high-power rocket program, integrating u-blox SAM-M8Q GPS and 900 MHz LoRa telemetry downlink.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ─── AVIONICS PCB — FULL-SCREEN PDF VIEWER ─────────────── */

    html, body { overflow: hidden; height: 100%; }

    .av-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      background: rgba(243, 241, 236, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .av-back {
      font-family: var(--font-mono);
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      color: var(--gold-text);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .av-back:hover { opacity: 0.7; }

    .av-download {
      font-family: var(--font-mono);
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      color: var(--gold-text);
      border: 1px solid var(--gold-border);
      padding: 0.35rem 0.9rem;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .av-download:hover {
      background: var(--gold-dim);
      border-color: var(--gold-text);
    }

    .av-pdf-frame {
      position: fixed;
      top: 48px; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: calc(100% - 48px);
      border: none;
      display: block;
    }

    @media (max-width: 640px) {
      .av-bar       { height: 52px; padding: 0 1rem; }
      .av-pdf-frame { top: 52px; height: calc(100% - 52px); }
    }
  </style>
</head>
<body>

  <!-- ── OVERLAY BAR ───────────────────────────────────────── -->
  <div class="av-bar">
    <a href="../#work" class="av-back">← SELECTED WORK</a>
    <a href="../assets/AVIONICS%20PCB%20FILES/Christopher%20Sparrow%20AerospaceNU%20Avionics%20PCB%20Portfolio%20Update.pdf"
       download
       target="_blank"
       class="av-download">DOWNLOAD PDF · 5.6 MB ↓</a>
  </div>

  <!-- ── FULL-SCREEN PDF ───────────────────────────────────── -->
  <iframe
    src="../assets/AVIONICS%20PCB%20FILES/Christopher%20Sparrow%20AerospaceNU%20Avionics%20PCB%20Portfolio%20Update.pdf"
    class="av-pdf-frame"
    title="Custom Avionics GPS/Radio PCB — Portfolio Case Study">
  </iframe>

  <script src="../js/main.js"></script>
</body>
