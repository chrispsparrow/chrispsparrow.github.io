  <style>
    /* ─── AVIONICS PCB — FULL-SCREEN PDF VIEWER ─────────────── */

    /* Flex column: site nav + back/download bar stack at the top, the PDF
       iframe fills the remaining height. */
    html { height: 100%; }
    body {
      height: 100vh;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Site nav in normal flow (not fixed) on this utility page; opaque and
       compact regardless of scroll so it always reads over the PDF. */
    #nav {
      position: static;
      flex: 0 0 auto;
      padding: 1rem 2rem;
      background: rgba(243, 241, 236, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Secondary bar: back link + download */
    .av-bar {
      flex: 0 0 auto;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .av-back {
      font-family: var(--font-text);
      font-size: 0.88rem;
      letter-spacing: normal;
      color: var(--gold-text);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .av-back:hover { opacity: 0.7; }
    .av-download {
      font-family: var(--font-text);
      font-size: 0.88rem;
      letter-spacing: normal;
      color: var(--gold-text);
      border: 1px solid var(--gold-border);
      padding: 0.3rem 0.85rem;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .av-download:hover { background: var(--gold-dim); border-color: var(--gold-text); }

    .av-pdf-frame {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;      /* allow the iframe to shrink inside the flex column */
      border: none;
      display: block;
    }

    @media (max-width: 640px) {
      #nav     { padding: 0.9rem 1rem; }
      .av-bar  { padding: 0 1rem; }
    }
  </style>
</head>
