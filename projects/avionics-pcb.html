<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Avionics GPS/Radio PCB — Christopher Sparrow</title>
  <meta name="description" content="Portfolio case study: custom 4-layer KiCad PCB for AerospaceNU's high-power rocket program, integrating u-blox SAM-M8Q GPS and 900 MHz LoRa telemetry downlink.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ─── AVIONICS PCB — FULL-SCREEN PDF VIEWER ─────────────── */

    /* Flex column: site nav + back/download bar stack at the top, the PDF
       iframe fills the remaining height. */
    html { height: 100%; }
    body {
      height: 100vh;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Site nav in normal flow (not fixed) on this utility page; opaque and
       compact regardless of scroll so it always reads over the PDF. */
    #nav {
      position: static;
      flex: 0 0 auto;
      padding: 1rem 2rem;
      background: rgba(243, 241, 236, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Secondary bar: back link + download */
    .av-bar {
      flex: 0 0 auto;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .av-back {
      font-family: var(--font-mono);
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      color: var(--gold-text);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .av-back:hover { opacity: 0.7; }
    .av-download {
      font-family: var(--font-mono);
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      color: var(--gold-text);
      border: 1px solid var(--gold-border);
      padding: 0.3rem 0.85rem;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .av-download:hover { background: var(--gold-dim); border-color: var(--gold-text); }

    .av-pdf-frame {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;      /* allow the iframe to shrink inside the flex column */
      border: none;
      display: block;
    }

    @media (max-width: 640px) {
      #nav     { padding: 0.9rem 1rem; }
      .av-bar  { padding: 0 1rem; }
    }
  </style>
</head>
<body>

  <!-- ── SITE NAV (matches homepage; links back to home sections) ── -->
  <nav id="nav" aria-label="Main navigation">
    <a href="../index.html" class="nav-name" aria-label="Christopher Sparrow — home">Christopher Sparrow</a>
    <button class="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links">
      <a href="../index.html#work">Work</a>
      <a href="../index.html#about">About</a>
      <a href="../index.html#skills">Skills</a>
      <a href="../index.html#contact">Contact</a>
      <a href="../assets/Christopher_Sparrow_Resume.pdf" class="nav-resume" target="_blank" rel="noopener" aria-label="Open résumé (PDF)">Résumé ↗</a>
    </div>
  </nav>

  <!-- ── BACK / DOWNLOAD BAR ───────────────────────────────── -->
  <div class="av-bar">
    <a href="../index.html#work" class="av-back">← SELECTED WORK</a>
    <a href="../assets/Avionics%20PCB%20Files%20x2/Sparrow_Avionics_PCB.pdf"
       download
       target="_blank"
       class="av-download">DOWNLOAD PDF · 2.5 MB ↓</a>
  </div>

  <!-- ── FULL-SCREEN PDF ───────────────────────────────────── -->
  <iframe
    src="../assets/Avionics%20PCB%20Files%20x2/Sparrow_Avionics_PCB.pdf"
    class="av-pdf-frame"
    title="Custom Avionics GPS/Radio PCB — Portfolio Case Study">
  </iframe>

  <script src="../js/main.js"></script>
</body>
</html>
